[book]
title = "Wiki"
description = "Wiki"
authors = ["Aidanbek Kalymbekov"]
language = "ru"


[output.html]
mathjax-support = true
site-url = "/book/"
git-repository-url = "https://github.com/aidanbek/wiki"

[output.linkcheck]
# Проверяем только внутренние ссылки — внешние URL отключены, чтобы сборка
# не падала из-за временной недоступности сторонних сайтов.
follow-web-links = false
# Битая внутренняя ссылка должна валить сборку, а не быть warning'ом.
warning-policy = "error"
